%YAML:1.0
# NvDCF 트래커 — 라인 카운팅 최적화 (Jetson Orin Nano)
#
# IOU 대비 개선점:
#   - 시각적 특징(ColorNames + HOG)으로 ID 스왑 대폭 감소
#   - Kalman 필터 궤적 예측으로 일시적 소실(occlusion) 버텨냄
#   - maxShadowTrackingAge 확대로 감지 누락 프레임에도 ID 유지
#   - StateEstimator REGULAR(2)로 방향/속도 예측 정확도 향상

BaseConfig:
  minDetectorConfidence: 0.0    # bench_ds.py에서 conf 필터링하므로 0으로 두어 누락 방지

TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 0
  maxTargetsPerStream: 150

  # 카운팅용 핵심: shadow 추적 기간을 길게 → 짧은 occlusion 후에도 동일 ID 유지
  minIouDiff4NewTarget: 0.6       # 신규 타겟 생성 IOU 임계값 (perf보다 낮게 → 새 객체 빠르게 등록)
  minTrackerConfidence: 0.3       # shadow 전환 임계값
  probationAge: 1                 # 1프레임만 봐도 유효 타겟 → 빠른 카운팅 반응
  maxShadowTrackingAge: 80        # 약 2.7초(30fps) 동안 감지 없어도 ID 유지 (occlusion 대응)
  earlyTerminationAge: 1

TrajectoryManagement:
  useUniqueID: 0

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1       # CASCADED: 겹침-크기-시각 순으로 계단식 매칭
  checkClassMatch: 0              # 클래스 무관 트랙 연관 (ID 안정성 우선)

  # 연관 점수 임계값: 카운팅에서는 IOU+시각 복합 기준
  minMatchingScore4Overall: 0.35
  minMatchingScore4SizeSimilarity: 0.30
  minMatchingScore4Iou: 0.20
  minMatchingScore4VisualSimilarity: 0.50

  # 가중치: 시각 특징 비중 높여 ID 스왑 감소
  matchingScoreWeight4VisualSimilarity: 0.40
  matchingScoreWeight4SizeSimilarity: 0.35
  matchingScoreWeight4Iou: 0.35

  tentativeDetectorConfidence: 0.15
  minMatchingScore4TentativeIou: 0.45

StateEstimator:
  stateEstimatorType: 2           # REGULAR: Kalman 필터로 위치/속도/크기 예측

  # Jetson Orin Nano: 노이즈 값은 perf 기본값 사용 (CCTV 고정 카메라 기준)
  processNoiseVar4Loc: 1.5
  processNoiseVar4Size: 1.3
  processNoiseVar4Vel: 0.03
  measurementNoiseVar4Detector: 3.0
  measurementNoiseVar4Tracker: 8.0

VisualTracker:
  visualTrackerType: 1            # NvDCF

  # ColorNames + HOG: 색상·형태 동시 사용 → 유사 외관 객체 구분력 향상
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 2          # 2=중간 크기 (perf 수준, Jetson 성능 균형)
  featureFocusOffsetFactor_y: -0.15

  # 필터 학습률: 낮을수록 안정적, 높을수록 빠른 적응
  filterLr: 0.07                  # 안정적인 카운팅을 위해 낮게 유지
  filterChannelWeightsLr: 0.10
  gaussianSigma: 0.70
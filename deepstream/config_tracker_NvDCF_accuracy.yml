%YAML:1.0
# NvDCF 정확도 우선 프로파일
# 현재 perf(운영 기본값)보다 ID 안정성과 occlusion 복원력을 조금 더 높인 설정

BaseConfig:
  minDetectorConfidence: 0.0

TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 0
  maxTargetsPerStream: 150
  minIouDiff4NewTarget: 0.55
  minTrackerConfidence: 0.25
  probationAge: 2
  maxShadowTrackingAge: 120
  earlyTerminationAge: 2

TrajectoryManagement:
  useUniqueID: 0

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  checkClassMatch: 0
  minMatchingScore4Overall: 0.40
  minMatchingScore4SizeSimilarity: 0.35
  minMatchingScore4Iou: 0.18
  minMatchingScore4VisualSimilarity: 0.55
  matchingScoreWeight4VisualSimilarity: 0.50
  matchingScoreWeight4SizeSimilarity: 0.30
  matchingScoreWeight4Iou: 0.25
  tentativeDetectorConfidence: 0.12
  minMatchingScore4TentativeIou: 0.40

StateEstimator:
  stateEstimatorType: 2
  processNoiseVar4Loc: 1.2
  processNoiseVar4Size: 1.0
  processNoiseVar4Vel: 0.02
  measurementNoiseVar4Detector: 2.5
  measurementNoiseVar4Tracker: 7.0

VisualTracker:
  visualTrackerType: 1
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 3
  featureFocusOffsetFactor_y: -0.10
  filterLr: 0.04
  filterChannelWeightsLr: 0.08
  gaussianSigma: 0.65
